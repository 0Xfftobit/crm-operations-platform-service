name: ci
on: [push, pull_request]
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install uv
          uv sync --extra dev
          uv run --extra dev ruff check src config tests
          uv run --extra dev pytest -q tests
          uv run --extra dev mypy src/api config
  agents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [compliance_monitor, feedback_loop, follow_up_sequences, performance_analytics, task_automation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: '0.11.x'
          enable-cache: true
      - name: test agent
        run: |
          cd src/agents/${{ matrix.agent }}
          uv sync --all-groups
          uv run ruff check app tests
          uv run pytest -q
