[project]
name = "crequity-compliance-monitoring"
description = "Compliance Monitoring engine — FastAPI lean core (Engine 8 audit + governance)"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Redis hot-cache tier (CACHE_GATEWAY=redis) — optional, lazily imported.
redis = ["redis>=5.0"]
# Kafka bus (KAFKA_PRODUCE / KAFKA_INGEST) — async producer + consumer, lazily imported.
kafka = ["aiokafka>=0.11"]
# WORM audit mirror on S3 Object Lock (WORM_GATEWAY=s3) — lazily imported.
worm-s3 = ["boto3>=1.34"]
# Batch disparity analytics (jobs/disparity_batch.py, run via spark-submit).
spark = ["pyspark>=3.5"]
# Distributed tracing (TRACING_ENABLED=true) — optional, lazily imported.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "fakeredis>=2.20",
    "aiokafka>=0.11",
    "boto3>=1.34",
    "moto>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
