global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: "agents"
    static_configs:
      - targets:
          - "compliance_monitor:8000"
          - "task_automation:8000"
          - "follow_up_sequences:8000"
          - "feedback_loop:8000"
          - "performance_analytics:8000"
    metrics_path: /metrics
