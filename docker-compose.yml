name: crm-operations-platform-service

# One project, one container, one port. The unified image bundles all agents + the gateway; a
# process supervisor runs them internally (agents on 127.0.0.1:8001+, gateway public on 8080).
# Previous per-agent microservices layout preserved in docker-compose.services.yml.
services:
  crm-operations-platform-service:
    build: .
    image: crm-operations-platform-service:latest
    environment:
      API_KEY: ${API_KEY:-change-me-dev-key}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped
