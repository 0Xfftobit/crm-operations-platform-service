name: crm-operations-platform-service

# Monorepo-of-services: each agent is its original engine (kept intact under
# src/agents/<name>/, built from its own Dockerfile) serving on PORT=8000; the gateway
# proxies /<agent-slug>/* to each. Engines default to in-memory backends so this comes
# up without external services — point each at a DB via its own env for durability.
#
# The optional `infra` profile adds Postgres, Redis, Redpanda (Kafka API),
# Schema Registry, Prometheus, Grafana, and OpenTelemetry Collector for a
# local staging / P4 integration environment:
#   docker compose --profile infra up --build

x-agent-env: &agent-env
  PORT: "8000"
  WEB_CONCURRENCY: "1"
  LOG_LEVEL: "info"
  API_KEY: ${API_KEY:-change-me-dev-key}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}

services:
  gateway:
    build: .
    environment:
      API_KEY: ${API_KEY:-change-me-dev-key}
      GATEWAY_TIMEOUT: ${GATEWAY_TIMEOUT:-30.0}
      COMPLIANCE_MONITOR_URL: http://compliance_monitor:8000
      TASK_AUTOMATION_URL: http://task_automation:8000
      FOLLOW_UP_SEQUENCES_URL: http://follow_up_sequences:8000
      FEEDBACK_LOOP_URL: http://feedback_loop:8000
      PERFORMANCE_ANALYTICS_URL: http://performance_analytics:8000
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      compliance_monitor:
        condition: service_healthy
      task_automation:
        condition: service_healthy
      follow_up_sequences:
        condition: service_healthy
      feedback_loop:
        condition: service_healthy
      performance_analytics:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  compliance_monitor:
    build:
      context: ./src/agents/compliance_monitor
    environment:
      <<: *agent-env
      CACHE_GATEWAY: ${CMS_CACHE_GATEWAY:-redis}
      STORAGE_GATEWAY: ${CMS_STORAGE_GATEWAY:-memory}
      DATABASE_URL: ${CMS_DATABASE_URL:-postgresql+psycopg://crm_ops:crm_ops@postgres:5432/compliance_monitor}
      KAFKA_PRODUCE: ${CMS_KAFKA_PRODUCE:-false}
      KAFKA_INGEST: ${CMS_KAFKA_INGEST:-false}
      KAFKA_TOPIC: ${CMS_KAFKA_TOPIC:-compliance-audit}
      EVENT_SOURCE_GATEWAY: ${CMS_EVENT_SOURCE_GATEWAY:-local}
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  task_automation:
    build:
      context: ./src/agents/task_automation
    environment:
      <<: *agent-env
      IDEMPOTENCY_BACKEND: ${TAS_IDEMPOTENCY_BACKEND:-redis}
      STORAGE_BACKEND: ${TAS_STORAGE_BACKEND:-memory}
      DATABASE_URL: ${TAS_DATABASE_URL:-postgresql://taskauto:taskauto@postgres:5432/task_automation}
      KAFKA_CONSUMER_ENABLED: ${TAS_KAFKA_CONSUMER_ENABLED:-false}
      KAFKA_TOPICS: ${TAS_KAFKA_TOPICS:-deal.stage_changed,lead.assigned,document.received}
      TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-false}
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  follow_up_sequences:
    build:
      context: ./src/agents/follow_up_sequences
    environment:
      <<: *agent-env
      CACHE_GATEWAY: ${FUS_CACHE_GATEWAY:-redis}
      STORAGE_GATEWAY: ${FUS_STORAGE_GATEWAY:-memory}
      DATABASE_URL: ${FUS_DATABASE_URL:-postgresql+psycopg://crm_ops:crm_ops@postgres:5432/followup_sequence}
      EVENT_SOURCE_GATEWAY: ${FUS_EVENT_SOURCE_GATEWAY:-local}
      KAFKA_TOPIC: ${FUS_KAFKA_TOPIC:-followup-events}
      COMPLIANCE_MONITOR_URL: ${COMPLIANCE_MONITOR_URL:-http://compliance_monitor:8000}
      FUS_PRECHECK_ENABLED: ${FUS_PRECHECK_ENABLED:-true}
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  feedback_loop:
    build:
      context: ./src/agents/feedback_loop
    environment:
      <<: *agent-env
      STORAGE_BACKEND: ${FLS_STORAGE_BACKEND:-memory}
      DATA_DIR: /app/data/feedback_loop
      MODEL_SNAPSHOT_DIR: /app/data/feedback_loop/models
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  performance_analytics:
    build:
      context: ./src/agents/performance_analytics
    environment:
      <<: *agent-env
      STORAGE_BACKEND: ${PAS_STORAGE_BACKEND:-memory}
      DATA_DIR: /app/data/performance_analytics
      FEEDBACK_LOOP_URL: ${FEEDBACK_LOOP_URL:-http://feedback_loop:8000}
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # Optional infrastructure profile for local staging / P4 integration
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_USER: crm_ops
      POSTGRES_PASSWORD: crm_ops
      POSTGRES_DB: crm_ops
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_ops -d crm_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: ["infra"]
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --default-log-level=warn
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || rpk redpanda admin brokers list"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["infra"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["infra"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    profiles: ["infra"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  prometheus_data:
  grafana_data:
