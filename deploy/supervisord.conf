# Single-container supervisor: all agents (each in its own process/working-dir so their identical
# `app` packages don't collide) on 127.0.0.1:800x + the gateway on the public :8080.
[supervisord]
nodaemon=true
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:compliance_monitor]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 --no-access-log
directory=/app/src/agents/compliance_monitor
environment=STORAGE_GATEWAY="%(ENV_COMPLIANCE_MONITOR_STORAGE)s",DB_AUTO_CREATE="true",DATABASE_URL="%(ENV_COMPLIANCE_MONITOR_URL)s"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:task_automation]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 --no-access-log
directory=/app/src/agents/task_automation
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:follow_up_sequences]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8003 --no-access-log
directory=/app/src/agents/follow_up_sequences
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --no-access-log
directory=/app
environment=COMPLIANCE_MONITOR_URL="http://127.0.0.1:8001",TASK_AUTOMATION_URL="http://127.0.0.1:8002",FOLLOW_UP_SEQUENCES_URL="http://127.0.0.1:8003"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
